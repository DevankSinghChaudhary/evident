[project]
name = "evident"
version = "1.0"
description = "Research Engine for AI"
readme = "README.md"
authors = [
    { name = "devanksinghchaudhary", email = "devanksinghchaudhary@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[openai]>=1.4.7",
]

[project.scripts]
evident = "evident:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
