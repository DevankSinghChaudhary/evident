[project]
site_name = "Evident"
site_description = "A decoupled research engine for AI systems and agents."
site_author = "Devank Singh Chaudhary"
repo_url = "https://github.com/devanksinghchaudhary/evident"

docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Overview" = [
    "index.md",
    "concepts.md",
  ]},
  { "Setup" = [
    "get-started.md",
    "runtime/ollama.md",
  ]},
  { "Technical reference" = [
    "reference/requirements.md",
    "reference/project-status.md",
  ]},
]

copyright = '&copy; 2026 Evident. Released under the <a href="https://github.com/DevankSinghChaudhary/evident?tab=MIT-1-ov-file">MIT License</a>.'

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/devanksinghchaudhary/evident"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:devanksinghchaudhary@gmail.com"
name = "Email"

[project.theme]
custom_dir = "overrides"
favicon = "assets/favicon.svg"
logo = "assets/favicon.svg"
features = [
  "navigation.path",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
